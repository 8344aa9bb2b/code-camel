name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node (for ESLint)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ESLint
        run: npm install -g eslint --no-audit --no-fund

      - name: Download Checkstyle
        run: python scripts/install_checkstyle.py

      - name: Download SpotBugs
        run: python scripts/install_spotbugs.py

      - name: Run tests
        env:
          CHECKSTYLE_JAR: ${{ github.workspace }}/checkstyle.jar
          SPOTBUGS_JAR: ${{ github.workspace }}/spotbugs-dist/spotbugs-4.10.3/lib/spotbugs.jar
        run: pytest

      - name: Smoke-test analysis pipeline
        env:
          CHECKSTYLE_JAR: ${{ github.workspace }}/checkstyle.jar
          SPOTBUGS_JAR: ${{ github.workspace }}/spotbugs-dist/spotbugs-4.10.3/lib/spotbugs.jar
        run: python -m app.analysis.cli app --json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Render
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"serviceId": "${{ secrets.RENDER_SERVICE_ID }}"}' \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys
